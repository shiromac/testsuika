<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>にゃんこゲーム</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #2d1b0e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}

#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(400px, 95vw);
  padding: 8px 4px;
}

#score-area {
  background: #f5e6c8;
  border-radius: 12px;
  padding: 6px 18px;
  text-align: center;
  border: 3px solid #c4a265;
}

#score-label {
  font-size: 11px;
  color: #8b6914;
  font-weight: bold;
}

#score {
  font-size: 28px;
  font-weight: bold;
  color: #5a3e1b;
}

#next-area {
  background: #f5e6c8;
  border-radius: 12px;
  padding: 6px 14px;
  text-align: center;
  border: 3px solid #c4a265;
  display: flex;
  align-items: center;
  gap: 8px;
}

#next-label {
  font-size: 11px;
  color: #8b6914;
  font-weight: bold;
}

#next-preview {
  width: 40px;
  height: 40px;
}

#game-container {
  position: relative;
  width: min(400px, 95vw);
  aspect-ratio: 400 / 560;
  background: #f5e6c8;
  border-radius: 0 0 16px 16px;
  overflow: hidden;
  border: 4px solid #c4a265;
  border-top: none;
}

#drop-zone {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: rgba(245, 230, 200, 0.2);
  z-index: 10;
  border-bottom: 2px dashed rgba(196, 162, 101, 0.4);
}

#guide-line {
  position: absolute;
  top: 60px;
  width: 2px;
  bottom: 0;
  background: rgba(196, 162, 101, 0.4);
  z-index: 5;
  pointer-events: none;
  transition: left 0.05s linear;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#game-over-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.65);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

#game-over-overlay.active {
  display: flex;
}

#game-over-overlay h2 {
  color: #fff;
  font-size: 36px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

#final-score {
  color: #ffd700;
  font-size: 24px;
  font-weight: bold;
}

#restart-btn {
  padding: 14px 40px;
  font-size: 20px;
  background: #e8563a;
  color: #fff;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

#restart-btn:active {
  transform: scale(0.95);
}

#evolution-chart {
  width: min(400px, 95vw);
  margin-top: 8px;
  background: #f5e6c8;
  border-radius: 12px;
  padding: 8px;
  border: 3px solid #c4a265;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-wrap: wrap;
}

.evo-item {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  color: #5a3e1b;
}

.evo-arrow {
  font-size: 10px;
  color: #8b6914;
}
</style>
</head>
<body>

<div id="header">
  <div id="score-area">
    <div id="score-label">SCORE</div>
    <div id="score">0</div>
  </div>
  <div id="next-area">
    <div id="next-label">NEXT</div>
    <canvas id="next-preview"></canvas>
  </div>
</div>

<div id="game-container">
  <div id="drop-zone"></div>
  <div id="guide-line"></div>
  <canvas id="game-canvas"></canvas>
  <div id="game-over-overlay">
    <h2>GAME OVER</h2>
    <div id="final-score"></div>
    <button id="restart-btn">もう一度</button>
  </div>
</div>

<div id="evolution-chart" id="evo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(function() {
  // --- Cat definitions (sizes 1x~1.5x of original fruit radii) ---
  const FRUITS = [
    { name: '子猫',         radius: 15,  color: '#ffe4c4', stroke: '#dcc4a4', points: 1,  emoji: '🐱' },
    { name: 'ミケ猫',       radius: 20,  color: '#f5a623', stroke: '#d4891a', points: 3,  emoji: '😺' },
    { name: 'シャム猫',     radius: 26,  color: '#d4a574', stroke: '#b8885a', points: 6,  emoji: '😸' },
    { name: 'マンチカン',   radius: 33,  color: '#f0c060', stroke: '#d4a840', points: 10, emoji: '😻' },
    { name: 'スコティッシュ', radius: 41, color: '#a8a8a8', stroke: '#888888', points: 15, emoji: '😽' },
    { name: 'アメショ',     radius: 50,  color: '#c0c0c0', stroke: '#9a9a9a', points: 21, emoji: '😹' },
    { name: 'ロシアンブルー', radius: 60, color: '#7a9ab5', stroke: '#5e7f99', points: 28, emoji: '😿' },
    { name: 'ペルシャ',     radius: 70,  color: '#fff0e0', stroke: '#e6d5c0', points: 36, emoji: '😾' },
    { name: 'メインクーン', radius: 81,  color: '#8B6914', stroke: '#6b4f0e', points: 45, emoji: '🙀' },
    { name: 'ベンガル',     radius: 94,  color: '#d4a017', stroke: '#b08614', points: 55, emoji: '🐈' },
    { name: 'ライオン',     radius: 108, color: '#daa520', stroke: '#b8860b', points: 66, emoji: '🦁' },
  ];

  // --- Cat face visual configs ---
  const CAT_VISUALS = [
    { earInner: '#ffb6c1', eye: '#443322', nose: '#ff9999', blush: true },
    { earInner: '#ffb6c1', eye: '#228B22', nose: '#ff8888', patches: [[-0.3,-0.2,0.35,'#f5a623'],[0.25,0.15,0.3,'rgba(80,60,40,0.5)']] },
    { earInner: '#8B7355', eye: '#4169E1', nose: '#8B6540', mask: true },
    { earInner: '#ffb6c1', eye: '#FFD700', nose: '#ff9999', blush: true, bigEye: true },
    { earInner: '#bbb', eye: '#DAA520', nose: '#aaa', fold: true },
    { earInner: '#ffb6c1', eye: '#228B22', nose: '#cc8888', stripes: true },
    { earInner: '#8fa8b5', eye: '#00cc55', nose: '#8899aa' },
    { earInner: '#ffccdd', eye: '#6699ff', nose: '#ffaaaa', fluffy: true },
    { earInner: '#6b4f0e', eye: '#DAA520', nose: '#8B6914', tufts: true },
    { earInner: '#c4a017', eye: '#228B22', nose: '#b08614', spots: true },
    { earInner: '#c4a265', eye: '#ff8800', nose: '#b8860b', mane: true },
  ];

  // Build evolution chart with mini cat face canvases
  const evoChart = document.getElementById('evolution-chart');
  FRUITS.forEach((f, i) => {
    const item = document.createElement('span');
    item.className = 'evo-item';
    const miniCanvas = document.createElement('canvas');
    const miniSize = 22;
    const dpr = window.devicePixelRatio || 1;
    miniCanvas.width = miniSize * dpr;
    miniCanvas.height = miniSize * dpr;
    miniCanvas.style.width = miniSize + 'px';
    miniCanvas.style.height = miniSize + 'px';
    const mc = miniCanvas.getContext('2d');
    mc.scale(dpr, dpr);
    const mr = 8;
    mc.translate(miniSize / 2, miniSize / 2 + 1);
    mc.beginPath();
    mc.arc(0, 0, mr, 0, Math.PI * 2);
    mc.fillStyle = f.color;
    mc.fill();
    mc.strokeStyle = f.stroke;
    mc.lineWidth = 1;
    mc.stroke();
    drawCatFace(mc, mr, i);
    item.appendChild(miniCanvas);
    item.title = f.name;
    evoChart.appendChild(item);
    if (i < FRUITS.length - 1) {
      const arrow = document.createElement('span');
      arrow.className = 'evo-arrow';
      arrow.textContent = '→';
      evoChart.appendChild(arrow);
    }
  });

  // --- Matter.js setup ---
  const {
    Engine, Render, Runner, Bodies, Body, Composite, Events, Vector, Query, Constraint
  } = Matter;

  const container = document.getElementById('game-container');
  const canvas = document.getElementById('game-canvas');
  const guideLine = document.getElementById('guide-line');
  const scoreEl = document.getElementById('score');
  const nextPreview = document.getElementById('next-preview');
  const gameOverOverlay = document.getElementById('game-over-overlay');
  const finalScoreEl = document.getElementById('final-score');
  const restartBtn = document.getElementById('restart-btn');

  let GAME_W, GAME_H;
  let engine, render, runner;
  let score = 0;
  let currentFruitIndex = 0;
  let nextFruitIndex = 0;
  let dropX = 0;
  let canDrop = true;
  let gameOver = false;
  let fruitBodies = new Set();
  let gameOverCheckTimer = null;

  // --- Merge group system ---
  let mergeGroups = new Map();
  let bodyToGroup = new Map();
  let nextGroupId = 0;
  const MERGE_TIME = 3000;      // 3 seconds

  const DROP_Y = 60;
  const WALL_THICKNESS = 20;
  const CATEGORY_FRUIT = 0x0001;
  const CATEGORY_WALL = 0x0002;
  const CONSTRAINT_STIFFNESS = 0.005;

  // --- Audio: にゃ～ん SE ---
  let audioCtx = null;
  let lastNyaanTime = 0;

  function playNyaan() {
    const now = Date.now();
    if (now - lastNyaanTime < 200) return;
    lastNyaanTime = now;

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const t = audioCtx.currentTime;
    const baseFreq = 600 + Math.random() * 200;

    // Main "nyaa" tone
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(baseFreq, t);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 1.3, t + 0.07);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 0.85, t + 0.25);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 0.6, t + 0.35);
    gain1.gain.setValueAtTime(0, t);
    gain1.gain.linearRampToValueAtTime(0.15, t + 0.03);
    gain1.gain.linearRampToValueAtTime(0.10, t + 0.15);
    gain1.gain.linearRampToValueAtTime(0, t + 0.35);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(t);
    osc1.stop(t + 0.36);

    // Soft harmonic for warmth
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(baseFreq * 2, t);
    osc2.frequency.linearRampToValueAtTime(baseFreq * 2.5, t + 0.07);
    osc2.frequency.linearRampToValueAtTime(baseFreq * 1.7, t + 0.25);
    osc2.frequency.linearRampToValueAtTime(baseFreq * 1.2, t + 0.35);
    gain2.gain.setValueAtTime(0, t);
    gain2.gain.linearRampToValueAtTime(0.04, t + 0.03);
    gain2.gain.linearRampToValueAtTime(0.02, t + 0.15);
    gain2.gain.linearRampToValueAtTime(0, t + 0.35);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(t);
    osc2.stop(t + 0.36);
  }

  // --- 派手な「にゃー」: 進化・消滅時用 ---
  function playBigNyaan(isVanish) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const t = audioCtx.currentTime;
    const baseFreq = isVanish ? 500 + Math.random() * 150 : 650 + Math.random() * 200;
    const duration = isVanish ? 0.8 : 0.6;
    const volume = isVanish ? 0.3 : 0.22;

    // Main powerful "NYAA" tone
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(baseFreq, t);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 1.5, t + 0.08);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 1.2, t + 0.2);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 0.7, t + duration * 0.7);
    osc1.frequency.linearRampToValueAtTime(baseFreq * 0.4, t + duration);
    gain1.gain.setValueAtTime(0, t);
    gain1.gain.linearRampToValueAtTime(volume, t + 0.02);
    gain1.gain.linearRampToValueAtTime(volume * 0.7, t + duration * 0.5);
    gain1.gain.linearRampToValueAtTime(0, t + duration);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(t);
    osc1.stop(t + duration + 0.01);

    // Rich harmonic layer
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(baseFreq * 2, t);
    osc2.frequency.linearRampToValueAtTime(baseFreq * 3, t + 0.08);
    osc2.frequency.linearRampToValueAtTime(baseFreq * 2.2, t + 0.2);
    osc2.frequency.linearRampToValueAtTime(baseFreq * 1.4, t + duration);
    gain2.gain.setValueAtTime(0, t);
    gain2.gain.linearRampToValueAtTime(volume * 0.35, t + 0.02);
    gain2.gain.linearRampToValueAtTime(volume * 0.15, t + duration * 0.5);
    gain2.gain.linearRampToValueAtTime(0, t + duration);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(t);
    osc2.stop(t + duration + 0.01);

    // Sub-bass rumble for power
    const osc3 = audioCtx.createOscillator();
    const gain3 = audioCtx.createGain();
    osc3.type = 'sine';
    osc3.frequency.setValueAtTime(baseFreq * 0.5, t);
    osc3.frequency.linearRampToValueAtTime(baseFreq * 0.6, t + 0.08);
    osc3.frequency.linearRampToValueAtTime(baseFreq * 0.35, t + duration);
    gain3.gain.setValueAtTime(0, t);
    gain3.gain.linearRampToValueAtTime(volume * 0.25, t + 0.03);
    gain3.gain.linearRampToValueAtTime(volume * 0.1, t + duration * 0.6);
    gain3.gain.linearRampToValueAtTime(0, t + duration);
    osc3.connect(gain3);
    gain3.connect(audioCtx.destination);
    osc3.start(t);
    osc3.stop(t + duration + 0.01);

    if (isVanish) {
      // Extra shimmer for vanish - delayed echo "nyaa"
      const osc4 = audioCtx.createOscillator();
      const gain4 = audioCtx.createGain();
      osc4.type = 'sine';
      osc4.frequency.setValueAtTime(baseFreq * 1.3, t + 0.15);
      osc4.frequency.linearRampToValueAtTime(baseFreq * 1.6, t + 0.22);
      osc4.frequency.linearRampToValueAtTime(baseFreq * 0.9, t + 0.5);
      osc4.frequency.linearRampToValueAtTime(baseFreq * 0.5, t + duration);
      gain4.gain.setValueAtTime(0, t);
      gain4.gain.setValueAtTime(0, t + 0.14);
      gain4.gain.linearRampToValueAtTime(volume * 0.5, t + 0.18);
      gain4.gain.linearRampToValueAtTime(volume * 0.2, t + 0.5);
      gain4.gain.linearRampToValueAtTime(0, t + duration);
      osc4.connect(gain4);
      gain4.connect(audioCtx.destination);
      osc4.start(t + 0.14);
      osc4.stop(t + duration + 0.01);
    }
  }

  // --- 「にゃー」テキストエフェクト ---
  function createNyaaEffect(x, y, isVanish) {
    const startTime = Date.now();
    const text = isVanish ? 'にゃーーー!!!' : 'にゃー!!';
    const fontSize = isVanish ? 36 : 28;
    const effectDuration = isVanish ? 3000 : 2000;
    const color = isVanish ? '#ff2222' : '#ff6600';
    const scale0 = isVanish ? 0.3 : 0.5;

    const handler = function () {
      const ctx = render.context;
      const elapsed = Date.now() - startTime;
      if (elapsed > effectDuration) {
        Events.off(render, 'afterRender', handler);
        return;
      }

      const progress = elapsed / effectDuration;
      const alpha = progress < 0.15 ? progress / 0.15 : 1 - (progress - 0.15) / 0.85;
      const scale = scale0 + (1 - scale0) * Math.min(1, elapsed / 150);
      const offsetY = -elapsed * 0.06;
      const wobble = isVanish ? Math.sin(elapsed * 0.015) * 5 : 0;

      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.translate(x + wobble, y + offsetY);
      ctx.scale(scale, scale);

      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Glow
      ctx.shadowColor = color;
      ctx.shadowBlur = isVanish ? 20 : 12;

      ctx.strokeStyle = '#000';
      ctx.lineWidth = isVanish ? 5 : 4;
      ctx.strokeText(text, 0, 0);
      ctx.fillStyle = color;
      ctx.fillText(text, 0, 0);

      // Inner bright highlight
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = Math.max(0, alpha * 0.5);
      ctx.fillText(text, 0, -1);

      ctx.restore();
    };
    Events.on(render, 'afterRender', handler);
  }

  // --- Paw print drawing ---
  function drawPawPrint(ctx, size) {
    // Main pad
    ctx.beginPath();
    ctx.ellipse(0, size * 0.15, size * 0.38, size * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    // Toe beans
    const toes = [[-0.3,-0.28],[- 0.1,-0.42],[0.1,-0.42],[0.3,-0.28]];
    for (const [tx, ty] of toes) {
      ctx.beginPath();
      ctx.arc(size * tx, size * ty, size * 0.15, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- Cat face drawing ---
  function drawCatFace(ctx, r, index) {
    const v = CAT_VISUALS[index];
    const fur = FRUITS[index].color;
    const stk = FRUITS[index].stroke;
    const lw = Math.max(1, r * 0.04);

    // Lion mane
    if (v.mane) {
      ctx.beginPath();
      for (let i = 0; i < 18; i++) {
        const a = (Math.PI * 2 / 18) * i - Math.PI / 2;
        const mr = r * 1.28 + Math.sin(i * 3.5) * r * 0.12;
        if (i === 0) ctx.moveTo(Math.cos(a) * mr, Math.sin(a) * mr);
        else ctx.lineTo(Math.cos(a) * mr, Math.sin(a) * mr);
      }
      ctx.closePath();
      ctx.fillStyle = '#c4912a';
      ctx.fill();
      ctx.strokeStyle = '#a07820';
      ctx.lineWidth = lw;
      ctx.stroke();
    }

    // Persian fluffy outline
    if (v.fluffy) {
      ctx.beginPath();
      for (let i = 0; i < 24; i++) {
        const a = (Math.PI * 2 / 24) * i - Math.PI / 2;
        const fr = r * 1.06 + Math.sin(i * 5) * r * 0.05;
        if (i === 0) ctx.moveTo(Math.cos(a) * fr, Math.sin(a) * fr);
        else ctx.lineTo(Math.cos(a) * fr, Math.sin(a) * fr);
      }
      ctx.closePath();
      ctx.fillStyle = fur;
      ctx.fill();
    }

    // --- Ears ---
    [-1, 1].forEach(s => {
      ctx.beginPath();
      if (v.fold) {
        ctx.moveTo(s * r * 0.6, -r * 0.4);
        ctx.quadraticCurveTo(s * r * 0.55, -r * 0.78, s * r * 0.2, -r * 0.6);
      } else {
        ctx.moveTo(s * r * 0.7, -r * 0.3);
        ctx.lineTo(s * r * 0.45, -r * 1.05);
        ctx.lineTo(s * r * 0.05, -r * 0.55);
      }
      ctx.closePath();
      ctx.fillStyle = fur;
      ctx.fill();
      ctx.strokeStyle = stk;
      ctx.lineWidth = lw;
      ctx.stroke();

      // Inner ear
      ctx.beginPath();
      if (v.fold) {
        ctx.moveTo(s * r * 0.5, -r * 0.45);
        ctx.quadraticCurveTo(s * r * 0.48, -r * 0.67, s * r * 0.28, -r * 0.55);
      } else {
        ctx.moveTo(s * r * 0.58, -r * 0.38);
        ctx.lineTo(s * r * 0.43, -r * 0.88);
        ctx.lineTo(s * r * 0.15, -r * 0.55);
      }
      ctx.closePath();
      ctx.fillStyle = v.earInner;
      ctx.fill();

      // Maine Coon ear tufts
      if (v.tufts) {
        ctx.strokeStyle = stk;
        ctx.lineWidth = Math.max(1, r * 0.03);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s * r * 0.48, -r * 1.05);
        ctx.lineTo(s * r * 0.52, -r * 1.22);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s * r * 0.42, -r * 1.02);
        ctx.lineTo(s * r * 0.44, -r * 1.18);
        ctx.stroke();
      }
    });

    // --- Face markings ---
    // Calico patches
    if (v.patches) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.95, 0, Math.PI * 2);
      ctx.clip();
      for (const [px, py, pr, pc] of v.patches) {
        ctx.beginPath();
        ctx.arc(r * px, r * py, r * pr, 0, Math.PI * 2);
        ctx.fillStyle = pc;
        ctx.fill();
      }
      ctx.restore();
    }

    // Siamese mask
    if (v.mask) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.95, 0, Math.PI * 2);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#6B4226';
      ctx.lineWidth = r * 0.25;
      ctx.globalAlpha = 0.25;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Tabby M-mark
    if (v.stripes) {
      ctx.strokeStyle = '#777';
      ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.22, -r * 0.28);
      ctx.lineTo(-r * 0.1, -r * 0.42);
      ctx.lineTo(0, -r * 0.28);
      ctx.lineTo(r * 0.1, -r * 0.42);
      ctx.lineTo(r * 0.22, -r * 0.28);
      ctx.stroke();
    }

    // Bengal spots
    if (v.spots) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#8B6914';
      ctx.globalAlpha = 0.35;
      const sp = [[-0.35,-0.22,0.09],[0.33,-0.18,0.08],[-0.2,0.32,0.08],[0.28,0.34,0.09],[-0.42,0.1,0.07],[0.42,0.05,0.07]];
      for (const [sx, sy, sr] of sp) {
        ctx.beginPath();
        ctx.arc(r * sx, r * sy, r * sr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // --- Eyes ---
    const eyeY = r * 0.08;
    const eyeX = r * 0.35;
    const eyeR = r * (v.bigEye ? 0.22 : 0.17);

    [-1, 1].forEach(side => {
      const ex = side * eyeX;
      // White
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, eyeR, eyeR * 1.15, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#666';
      ctx.lineWidth = Math.max(0.5, r * 0.02);
      ctx.stroke();
      // Iris
      const iR = eyeR * 0.72;
      ctx.beginPath();
      ctx.arc(ex, eyeY + eyeR * 0.05, iR, 0, Math.PI * 2);
      ctx.fillStyle = v.eye;
      ctx.fill();
      // Pupil
      ctx.beginPath();
      ctx.ellipse(ex, eyeY + eyeR * 0.05, iR * 0.38, iR * 0.62, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();
      // Highlights
      ctx.beginPath();
      ctx.arc(ex + eyeR * 0.2, eyeY - eyeR * 0.18, eyeR * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex - eyeR * 0.12, eyeY + eyeR * 0.18, eyeR * 0.09, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill();
    });

    // --- Nose ---
    const noseY = r * 0.18;
    ctx.beginPath();
    ctx.moveTo(0, noseY - r * 0.04);
    ctx.lineTo(-r * 0.055, noseY + r * 0.03);
    ctx.quadraticCurveTo(0, noseY + r * 0.05, r * 0.055, noseY + r * 0.03);
    ctx.closePath();
    ctx.fillStyle = v.nose;
    ctx.fill();

    // --- Mouth ---
    const mY = noseY + r * 0.03;
    ctx.strokeStyle = '#888';
    ctx.lineWidth = Math.max(0.5, r * 0.025);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, mY);
    ctx.quadraticCurveTo(-r * 0.09, mY + r * 0.11, -r * 0.13, mY + r * 0.06);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, mY);
    ctx.quadraticCurveTo(r * 0.09, mY + r * 0.11, r * 0.13, mY + r * 0.06);
    ctx.stroke();

    // --- Whiskers ---
    if (r >= 18) {
      ctx.strokeStyle = 'rgba(100,100,100,0.45)';
      ctx.lineWidth = Math.max(0.5, r * 0.015);
      [-1, 1].forEach(side => {
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(side * r * 0.2, r * 0.22 + i * r * 0.06);
          ctx.lineTo(side * r * 0.65, r * 0.16 + i * r * 0.09);
          ctx.stroke();
        }
      });
    }

    // --- Blush ---
    if (v.blush) {
      [-1, 1].forEach(side => {
        ctx.beginPath();
        ctx.arc(side * r * 0.42, r * 0.2, r * 0.09, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 150, 170, 0.35)';
        ctx.fill();
      });
    }
  }

  function scaleR(radius) {
    return radius * (GAME_W / 400);
  }

  function randomSmallFruit() {
    return Math.floor(Math.random() * 5);
  }

  function init() {
    const rect = container.getBoundingClientRect();
    GAME_W = rect.width;
    GAME_H = rect.height;
    canvas.width = GAME_W;
    canvas.height = GAME_H;

    score = 0;
    scoreEl.textContent = '0';
    gameOver = false;
    canDrop = true;
    fruitBodies = new Set();
    mergeGroups = new Map();
    bodyToGroup = new Map();
    nextGroupId = 0;
    gameOverOverlay.classList.remove('active');

    if (engine) {
      Composite.clear(engine.world, false);
      Engine.clear(engine);
    }
    if (runner) Runner.stop(runner);
    if (render) Render.stop(render);

    engine = Engine.create({
      gravity: { x: 0, y: 0.8 }
    });

    render = Render.create({
      canvas: canvas,
      engine: engine,
      options: {
        width: GAME_W,
        height: GAME_H,
        wireframes: false,
        background: '#f5e6c8',
        pixelRatio: window.devicePixelRatio || 1
      }
    });

    // Walls
    const wallOptions = {
      isStatic: true,
      render: { fillStyle: '#c4a265' },
      friction: 0.3,
      collisionFilter: { category: CATEGORY_WALL }
    };

    const floor = Bodies.rectangle(
      GAME_W / 2, GAME_H + WALL_THICKNESS / 2 - 2,
      GAME_W, WALL_THICKNESS, wallOptions
    );
    const leftWall = Bodies.rectangle(
      -WALL_THICKNESS / 2 + 2, GAME_H / 2,
      WALL_THICKNESS, GAME_H * 2, wallOptions
    );
    const rightWall = Bodies.rectangle(
      GAME_W + WALL_THICKNESS / 2 - 2, GAME_H / 2,
      WALL_THICKNESS, GAME_H * 2, wallOptions
    );

    Composite.add(engine.world, [floor, leftWall, rightWall]);

    currentFruitIndex = randomSmallFruit();
    nextFruitIndex = randomSmallFruit();
    dropX = GAME_W / 2;
    guideLine.style.left = dropX + 'px';

    drawNextPreview();

    Events.on(engine, 'collisionStart', onCollision);
    Events.on(engine, 'beforeUpdate', updateMergeGroups);
    registerAfterRender();

    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);

    drawDropPreview();

    // Game over check
    if (gameOverCheckTimer) clearInterval(gameOverCheckTimer);
    gameOverCheckTimer = setInterval(checkGameOver, 500);
  }

  function drawNextPreview() {
    const ctx = nextPreview.getContext('2d');
    const size = 40;
    nextPreview.width = size * (window.devicePixelRatio || 1);
    nextPreview.height = size * (window.devicePixelRatio || 1);
    nextPreview.style.width = size + 'px';
    nextPreview.style.height = size + 'px';
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, size, size);

    const fruit = FRUITS[nextFruitIndex];
    const previewR = Math.min(fruit.radius * 0.45, 16);
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, previewR, 0, Math.PI * 2);
    ctx.fillStyle = fruit.color;
    ctx.fill();
    ctx.strokeStyle = fruit.stroke;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(size / 2, size / 2);
    drawCatFace(ctx, previewR, nextFruitIndex);
    ctx.restore();
  }

  function drawDropPreview() {
    // Ghost fruit drawn in afterRender
  }

  function createFruitBody(x, y, index) {
    const fruit = FRUITS[index];
    const r = scaleR(fruit.radius);
    const body = Bodies.circle(x, y, r, {
      restitution: 0.2,
      friction: 0.5,
      density: 0.001 + index * 0.0003,
      render: {
        fillStyle: fruit.color,
        strokeStyle: fruit.stroke,
        lineWidth: 2
      },
      collisionFilter: {
        category: CATEGORY_FRUIT,
        mask: CATEGORY_FRUIT | CATEGORY_WALL
      },
      label: 'fruit',
      fruitIndex: index
    });
    body.fruitIndex = index;
    body.dropTime = Date.now();
    Composite.add(engine.world, body);
    fruitBodies.add(body);
    return body;
  }

  function dropFruit() {
    if (!canDrop || gameOver) return;
    canDrop = false;

    const r = scaleR(FRUITS[currentFruitIndex].radius);
    const clampedX = Math.max(r + 4, Math.min(GAME_W - r - 4, dropX));
    createFruitBody(clampedX, DROP_Y - r, currentFruitIndex);

    currentFruitIndex = nextFruitIndex;
    nextFruitIndex = randomSmallFruit();
    drawNextPreview();

    setTimeout(() => {
      canDrop = true;
    }, 400);
  }

  // --- Merge Group System ---

  function createMergeGroup(bodyA, bodyB, fruitIndex) {
    const gid = nextGroupId++;
    const constraint = Constraint.create({
      bodyA: bodyA,
      bodyB: bodyB,
      stiffness: CONSTRAINT_STIFFNESS,
      damping: 0.1,
      length: 0,
      render: { visible: false }
    });
    Composite.add(engine.world, constraint);

    const group = {
      fruitIndex,
      bodies: new Set([bodyA, bodyB]),
      startTime: Date.now(),
      constraints: [constraint]
    };
    mergeGroups.set(gid, group);
    bodyToGroup.set(bodyA.id, gid);
    bodyToGroup.set(bodyB.id, gid);
    playNyaan();
  }

  function addToMergeGroup(gid, body) {
    const group = mergeGroups.get(gid);
    if (!group) return;

    // Connect to nearest body in the group
    let nearest = null;
    let nearestDist = Infinity;
    for (const b of group.bodies) {
      const dx = b.position.x - body.position.x;
      const dy = b.position.y - body.position.y;
      const dist = dx * dx + dy * dy;
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = b;
      }
    }

    if (nearest) {
      const constraint = Constraint.create({
        bodyA: nearest,
        bodyB: body,
        stiffness: CONSTRAINT_STIFFNESS,
        damping: 0.1,
        length: 0,
        render: { visible: false }
      });
      Composite.add(engine.world, constraint);
      group.constraints.push(constraint);
    }

    group.bodies.add(body);
    bodyToGroup.set(body.id, gid);
    group.startTime = Date.now(); // Reset timer on combo
    playNyaan();
  }

  function joinGroups(gidA, gidB, bodyA, bodyB) {
    const groupA = mergeGroups.get(gidA);
    const groupB = mergeGroups.get(gidB);
    if (!groupA || !groupB) return;

    const constraint = Constraint.create({
      bodyA: bodyA,
      bodyB: bodyB,
      stiffness: CONSTRAINT_STIFFNESS,
      damping: 0.1,
      length: 0,
      render: { visible: false }
    });
    Composite.add(engine.world, constraint);
    groupA.constraints.push(constraint);

    for (const b of groupB.bodies) {
      groupA.bodies.add(b);
      bodyToGroup.set(b.id, gidA);
    }
    for (const c of groupB.constraints) {
      groupA.constraints.push(c);
    }
    groupA.startTime = Date.now(); // Reset timer on combo
    mergeGroups.delete(gidB);
    playNyaan();
  }

  function resolveMergeGroup(gid) {
    const group = mergeGroups.get(gid);
    if (!group) return;

    const bodies = [...group.bodies];
    const count = bodies.length;
    const fruitIndex = group.fruitIndex;

    // Evolution: 2 -> +1, 3 -> +2, 4 -> +3, etc.
    const newIndex = Math.min(fruitIndex + count - 1, FRUITS.length - 1);
    const actualSteps = newIndex - fruitIndex;

    // Centroid
    let cx = 0, cy = 0;
    for (const b of bodies) {
      cx += b.position.x;
      cy += b.position.y;
    }
    cx /= count;
    cy /= count;

    // Remove constraints
    for (const c of group.constraints) {
      try { Composite.remove(engine.world, c); } catch (e) {}
    }

    // Remove bodies
    for (const b of bodies) {
      fruitBodies.delete(b);
      bodyToGroup.delete(b.id);
      try { Composite.remove(engine.world, b); } catch (e) {}
    }

    mergeGroups.delete(gid);

    // Create evolved cat
    const newBody = createFruitBody(cx, cy, newIndex);
    Body.setVelocity(newBody, { x: 0, y: -3 });

    // Score: combo gives multiplier
    const basePoints = FRUITS[newIndex].points;
    const scoreGain = count >= 3 ? basePoints * count : basePoints;
    score += scoreGain;
    scoreEl.textContent = score;

    // Effects
    createMergeEffect(cx, cy, FRUITS[newIndex].color);
    playBigNyaan(false);
    createNyaaEffect(cx, cy, false);
    if (actualSteps >= 2) {
      createComboEffect(cx, cy, actualSteps, FRUITS[newIndex]);
    }
  }

  function updateMergeGroups() {
    const now = Date.now();
    const toResolve = [];
    for (const [gid, group] of mergeGroups) {
      if (now - group.startTime >= MERGE_TIME) {
        toResolve.push(gid);
      }
    }
    for (const gid of toResolve) {
      resolveMergeGroup(gid);
    }

    // Progressive difficulty: gravity DECREASES with score (lower = harder)
    if (engine) {
      engine.gravity.y = Math.max(0.3, 0.8 - score * 0.002);
    }
  }

  function onCollision(event) {
    for (const pair of event.pairs) {
      const { bodyA, bodyB } = pair;
      if (bodyA.fruitIndex === undefined || bodyB.fruitIndex === undefined) continue;
      if (bodyA.fruitIndex !== bodyB.fruitIndex) continue;

      // Max cat (ライオン): merge and vanish with big bonus
      if (bodyA.fruitIndex >= FRUITS.length - 1) {
        if (bodyToGroup.has(bodyA.id) || bodyToGroup.has(bodyB.id)) continue;
        fruitBodies.delete(bodyA);
        fruitBodies.delete(bodyB);
        try { Composite.remove(engine.world, bodyA); } catch(e) {}
        try { Composite.remove(engine.world, bodyB); } catch(e) {}
        const mx = (bodyA.position.x + bodyB.position.x) / 2;
        const my = (bodyA.position.y + bodyB.position.y) / 2;
        score += 200;
        scoreEl.textContent = score;
        createMergeEffect(mx, my, '#ffd700');
        createComboEffect(mx, my, 2, { emoji: '🦁', name: 'ライオン消滅!' });
        playBigNyaan(true);
        createNyaaEffect(mx, my, true);
        continue;
      }

      const gidA = bodyToGroup.get(bodyA.id);
      const gidB = bodyToGroup.get(bodyB.id);

      if (gidA !== undefined && gidB !== undefined) {
        if (gidA === gidB) continue;
        joinGroups(gidA, gidB, bodyA, bodyB);
      } else if (gidA !== undefined) {
        addToMergeGroup(gidA, bodyB);
      } else if (gidB !== undefined) {
        addToMergeGroup(gidB, bodyA);
      } else {
        createMergeGroup(bodyA, bodyB, bodyA.fruitIndex);
      }
    }
  }

  // --- Effects ---

  function createMergeEffect(x, y, color) {
    const particles = [];
    for (let i = 0; i < 8; i++) {
      const angle = (Math.PI * 2 / 8) * i;
      const speed = 2.5 + Math.random() * 1.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
        rot: Math.random() * Math.PI * 2,
        size: 24 + Math.random() * 12
      });
    }
    const handler = function () {
      const ctx = render.context;
      let alive = false;
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life -= 0.04;
        p.rot += 0.05;
        if (p.life <= 0) continue;
        alive = true;
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        drawPawPrint(ctx, p.size);
        ctx.restore();
      }
      if (!alive) {
        Events.off(render, 'afterRender', handler);
      }
    };
    Events.on(render, 'afterRender', handler);
  }

  function createComboEffect(x, y, count, fruit) {
    const startTime = Date.now();
    const handler = function () {
      const ctx = render.context;
      const elapsed = Date.now() - startTime;
      if (elapsed > 2500) {
        Events.off(render, 'afterRender', handler);
        return;
      }
      const alpha = 1 - elapsed / 2500;
      const offsetY = -elapsed * 0.04;

      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.fillStyle = '#ff4444';
      const text = `${count}段進化!`;
      ctx.strokeText(text, x, y + offsetY - 24);
      ctx.fillText(text, x, y + offsetY - 24);

      ctx.font = 'bold 20px Arial';
      ctx.fillStyle = '#ffd700';
      const nameText = `${fruit.emoji} ${fruit.name}`;
      ctx.strokeText(nameText, x, y + offsetY + 8);
      ctx.fillText(nameText, x, y + offsetY + 8);

      ctx.restore();
    };
    Events.on(render, 'afterRender', handler);
  }

  // --- Rendering ---

  function registerAfterRender() {
    Events.on(render, 'afterRender', function () {
      if (!render || !render.context) return;
      const ctx = render.context;

      // Draw cat faces on bodies
      for (const body of fruitBodies) {
        if (body.fruitIndex === undefined) continue;
        const fruit = FRUITS[body.fruitIndex];
        const r = scaleR(fruit.radius);
        ctx.save();
        ctx.translate(body.position.x, body.position.y);
        ctx.rotate(body.angle);
        drawCatFace(ctx, r, body.fruitIndex);
        ctx.restore();
      }

      // Draw merge group indicators
      const now = Date.now();
      for (const [gid, group] of mergeGroups) {
        const elapsed = now - group.startTime;
        const remaining = Math.max(0, MERGE_TIME - elapsed);
        const progress = remaining / MERGE_TIME;
        const pendingSteps = Math.min(group.bodies.size - 1, FRUITS.length - 1 - group.fruitIndex);
        const isCombo = pendingSteps >= 2;
        const arcColor = isCombo ? '#ff4444' : '#ffaa00';
        const pulse = isCombo ? 1 + 0.08 * Math.sin(now * 0.012) : 1;

        // Countdown arc on each body
        for (const body of group.bodies) {
          const fruit = FRUITS[body.fruitIndex];
          const r = scaleR(fruit.radius) * pulse;

          ctx.save();
          ctx.translate(body.position.x, body.position.y);

          ctx.beginPath();
          ctx.arc(0, 0, r + 5, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress, false);
          ctx.strokeStyle = arcColor;
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.restore();
        }

        // Group centroid for text
        let cx = 0, cy = 0, minY = Infinity;
        for (const body of group.bodies) {
          cx += body.position.x;
          cy += body.position.y;
          const r = scaleR(FRUITS[body.fruitIndex].radius);
          if (body.position.y - r < minY) minY = body.position.y - r;
        }
        cx /= group.bodies.size;

        const secs = Math.ceil(remaining / 1000);
        ctx.save();
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.fillStyle = '#fff';
        ctx.strokeText(secs, cx, minY - 14);
        ctx.fillText(secs, cx, minY - 14);

        if (isCombo) {
          ctx.font = 'bold 16px Arial';
          ctx.fillStyle = '#ff4444';
          const comboLabel = `${pendingSteps}段進化!`;
          ctx.strokeText(comboLabel, cx, minY - 34);
          ctx.fillText(comboLabel, cx, minY - 34);
        }

        ctx.restore();
      }

      // Draw ghost preview cat at drop position
      if (canDrop && !gameOver) {
        const fruit = FRUITS[currentFruitIndex];
        const r = scaleR(fruit.radius);
        const clampedX = Math.max(r + 4, Math.min(GAME_W - r - 4, dropX));

        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.translate(clampedX, DROP_Y - r);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = fruit.color;
        ctx.fill();
        ctx.strokeStyle = fruit.stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
        drawCatFace(ctx, r, currentFruitIndex);
        ctx.restore();
      }
    });
  }

  function checkGameOver() {
    if (gameOver) return;
    const now = Date.now();
    for (const body of fruitBodies) {
      // Grace period: ignore bodies created less than 2s ago
      if (now - body.dropTime < 2000) continue;
      const r = scaleR(FRUITS[body.fruitIndex].radius);
      if (body.position.y - r < DROP_Y &&
          Math.abs(body.velocity.y) < 0.5 &&
          body.speed < 1) {
        triggerGameOver();
        return;
      }
    }
  }

  function triggerGameOver() {
    gameOver = true;
    canDrop = false;
    if (gameOverCheckTimer) clearInterval(gameOverCheckTimer);

    finalScoreEl.textContent = `スコア: ${score}`;
    gameOverOverlay.classList.add('active');
  }

  // --- Input handling ---
  function getInputX(e) {
    const rect = container.getBoundingClientRect();
    if (e.touches) {
      return e.touches[0].clientX - rect.left;
    }
    return e.clientX - rect.left;
  }

  function onMove(e) {
    if (gameOver) return;
    e.preventDefault();
    dropX = getInputX(e);
    const fruit = FRUITS[currentFruitIndex];
    const r = scaleR(fruit.radius);
    dropX = Math.max(r + 4, Math.min(GAME_W - r - 4, dropX));
    guideLine.style.left = dropX + 'px';
  }

  function onDrop(e) {
    if (gameOver) return;
    e.preventDefault();
    if (e.changedTouches) {
      const rect = container.getBoundingClientRect();
      dropX = e.changedTouches[0].clientX - rect.left;
      const fruit = FRUITS[currentFruitIndex];
      const r = scaleR(fruit.radius);
      dropX = Math.max(r + 4, Math.min(GAME_W - r - 4, dropX));
    }
    dropFruit();
  }

  // Touch events
  container.addEventListener('touchmove', onMove, { passive: false });
  container.addEventListener('touchend', onDrop, { passive: false });

  // Mouse events (for desktop testing)
  container.addEventListener('mousemove', onMove);
  container.addEventListener('click', function (e) {
    if (gameOver) return;
    e.preventDefault();
    dropX = getInputX(e);
    const fruit = FRUITS[currentFruitIndex];
    const r = scaleR(fruit.radius);
    dropX = Math.max(r + 4, Math.min(GAME_W - r - 4, dropX));
    guideLine.style.left = dropX + 'px';
    dropFruit();
  });

  restartBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    init();
  });
  restartBtn.addEventListener('touchend', function (e) {
    e.stopPropagation();
    init();
  });

  // Handle resize
  window.addEventListener('resize', () => {
    if (gameOver) {
